name: Standalone replay
on: [push, pull_request]

jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -E -S -m unittest discover -s tests -v
      - run: python -E -S window_kernel.py --verify-report window-results-v2.json
